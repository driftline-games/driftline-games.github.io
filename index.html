<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driftline Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    color: #f0f0f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: 2.2rem;
    letter-spacing: 0.35em;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .tagline {
    color: #9a9aad;
    font-size: 1rem;
    margin-bottom: 48px;
  }
  .game {
    max-width: 560px;
    width: 100%;
  }
  .game h2 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .game p {
    color: #b9b9c9;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .store-btn {
    display: inline-block;
    background: #ffffff;
    color: #0a0a12;
    font-weight: 700;
    font-size: 1rem;
    padding: 14px 32px;
    border-radius: 8px;
    text-decoration: none;
  }
  .store-btn:hover { background: #e0e0e8; }
  footer {
    margin-top: 64px;
    font-size: 0.85rem;
    color: #77778a;
  }
  footer a {
    color: #9a9aad;
    text-decoration: none;
    margin: 0 10px;
  }
  footer a:hover { color: #f0f0f5; text-decoration: underline; }
</style>
</head>
<body>
  <h1>DRIFTLINE GAMES</h1>
  <p class="tagline">Independent game studio</p>

  <div class="game">
    <h2>Highway Chaos: Traffic Racing</h2>
    <p>A free arcade traffic racer. Weave through highway traffic at speed and cut it close. The black cars never signal.</p>
    <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.we.highwaychaos">Get it on Google Play</a>
  </div>

  <footer>
    <a href="https://driftline-games.github.io/Highway-Chaos-Privacy-Policy/">Privacy Policy</a>
    <a href="mailto:driftlinegames@gmail.com">Contact</a>
  </footer>
</body>
</html>
